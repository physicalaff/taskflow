name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm install
      - run: npm run lint
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t taskflow:ci .
      - name: Smoke test container
        run: |
          docker run -d --name taskflow -p 3000:3000 taskflow:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/healthz; then
              echo "healthy"
              docker stop taskflow
              exit 0
            fi
            sleep 1
          done
          docker logs taskflow
          exit 1
